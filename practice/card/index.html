<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Truculenta:opsz,wght@12..72,100..900&display=swap"
      rel="stylesheet"
    />
    <!-- google fonts -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <!-- font awesome -->
    <link rel="stylesheet" href="css/styl.css" />
    <!-- her zaman en alta ekleyelim çünkü verdiğimiz stiller ezilmesin. gerektiğinde kendimiz ezebilelim.-->
  </head>
  <body>
    <div class="card">
      <img src="img/landscape-01_480.jpg" alt="Safranbolu" />

      <button class="btn btn-share"><i class="fa-solid fa-share-nodes"></i></button>
      <button class="btn btn-favorite"><i class="fa-regular fa-heart"></i></button>

      <div class="card-body">
        <h3>Safranbolu</h3>
        <p>
          Lorem ipsum dolor sit amet, consectetur adipisicing elit. Nobis,
          voluptas?
        </p>
        <!-- lorem10 yazınca bir cümle geliyor -->
      </div>

      <div class="card-footer">
        <div>
          <i class="fa-solid fa-star"></i>
          <i class="fa-solid fa-star"></i>
          <i class="fa-solid fa-star"></i>
          <i class="fa-solid fa-star"></i>
          <i class="fa-regular fa-star"></i>
          <!-- boş yıldız yapmak için regular boş demek solid dolu -->
        </div>

        <a href="#">More <i class="fa-solid fa-chevron-right"></i></a>
      </div>
    </div>
  </body>
</html>
